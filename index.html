<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#150f09">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Day &amp; Night — Hex Kingdoms</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="boot" style="position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at center,#2a1d10 0,#0e0905 75%);color:#e6bf55;font-family:Cinzel,Georgia,serif;transition:opacity .5s">
  <img src="art/ui/logo.png" alt="Day &amp; Night — Hex Kingdoms" style="width:min(460px,78vw);max-height:38vh;object-fit:contain;filter:drop-shadow(0 4px 14px #000)">
  <div style="width:min(260px,60vw);height:6px;border:1px solid #6b4f18;border-radius:4px;overflow:hidden;background:#150f09"><i style="display:block;width:40%;height:100%;background:linear-gradient(90deg,#8a5f14,#f0cf70);animation:bootbar 1.1s ease-in-out infinite alternate"></i></div>
  <div id="bootq" style="max-width:min(520px,86vw);min-height:54px;text-align:center;font-style:italic;font-size:15px;line-height:1.4;color:#e8d8b0;transition:opacity .4s"></div>
</div>
<style>@keyframes bootbar{from{margin-left:0}to{margin-left:60%}}</style>
<div id="app">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ic-hi,#fff0b0)"/><stop offset=".55" style="stop-color:var(--ic-mid,#e0b040)"/><stop offset="1" style="stop-color:var(--ic-lo,#8a5f14)"/></linearGradient></defs>
  <symbol id="i-hero" viewBox="0 0 32 32"><path d="M6 20v-5C6 8 10 4 16 4s10 4 10 11v5l-3 8H9z" fill="url(#gGold)" stroke="#2a1604" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 15h12v4h-5v4h-2v-4h-5z" fill="#1a0f05"/><path d="M16 4v6" stroke="#2a1604" stroke-width="1.6"/><path d="M12 2c1-1 7-1 8 0" stroke="#c0392b" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="i-army" viewBox="0 0 32 32"><g stroke="#2a1604" stroke-width="1.4" stroke-linejoin="round"><path d="M5 4l5 0 17 17-3 3L5 7z" fill="url(#gGold)"/><path d="M27 4l-5 0L5 21l3 3L27 7z" fill="url(#gGold)"/></g><g stroke="#2a1604" stroke-width="1.6" stroke-linecap="round" fill="none"><path d="M22 20l6 6M10 20l-6 6M20 24l4-4M12 24L8 20"/></g></symbol>
  <symbol id="i-gear" viewBox="0 0 32 32"><path d="M16 3l11 4v9c0 6-5 10-11 13C10 26 5 22 5 16V7z" fill="url(#gGold)" stroke="#2a1604" stroke-width="1.6" stroke-linejoin="round"/><path d="M16 7v18M9 14h14" stroke="#2a1604" stroke-width="2.2"/><circle cx="16" cy="14" r="2.6" fill="#c0392b" stroke="#2a1604" stroke-width="1"/></symbol>
  <symbol id="i-land" viewBox="0 0 32 32"><path d="M3 7l8-3 10 3 8-3v21l-8 3-10-3-8 3z" fill="url(#gGold)" stroke="#2a1604" stroke-width="1.6" stroke-linejoin="round"/><path d="M11 4v21M21 7v21" stroke="#2a1604" stroke-width="1.2"/><path d="M13 20c3-6 5 2 8-6" stroke="#8a2a14" stroke-width="1.6" fill="none" stroke-dasharray="2 2"/><path d="M22 10l4 4m0-4l-4 4" stroke="#c0392b" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-town" viewBox="0 0 32 32"><path d="M3 28V12h4v-3h3v3h3V6h-1V3h8v3h-1v6h3V9h3v3h4v16z" fill="url(#gGold)" stroke="#2a1604" stroke-width="1.5" stroke-linejoin="round"/><path d="M13 28v-7a3 3 0 016 0v7z" fill="#1a0f05"/><path d="M15 3V1" stroke="#2a1604" stroke-width="1.6"/><path d="M15.5 1l5 1.5-5 1.5z" fill="#c0392b"/></symbol>
  <symbol id="i-end" viewBox="0 0 32 32"><path d="M8 3h16M8 29h16" stroke="#2a1604" stroke-width="3" stroke-linecap="round"/><path d="M10 3c0 7 3 9 6 13-3 4-6 6-6 13h12c0-7-3-9-6-13 3-4 6-6 6-13z" fill="url(#gGold)" stroke="#2a1604" stroke-width="1.6" stroke-linejoin="round"/><path d="M13 27c1-3 5-3 6 0z" fill="#2a1604"/><path d="M14 8h4l-2 4z" fill="#2a1604"/></symbol>
  <symbol id="i-menu" viewBox="0 0 32 32"><g stroke="#2a1604" stroke-width="1.4"><rect x="4" y="6" width="24" height="4.5" rx="2.2" fill="url(#gGold)"/><rect x="4" y="13.7" width="24" height="4.5" rx="2.2" fill="url(#gGold)"/><rect x="4" y="21.5" width="24" height="4.5" rx="2.2" fill="url(#gGold)"/></g></symbol>
</svg>
  <header id="top">
    <i class="sky skyD"></i><i class="sky skyN"></i>
    <div id="res"></div>
    <div id="income" class="chip" title="Expected daily income"></div>
    <span id="orb" title="Day: your turn · Night: the rivals move"><b class="sun">☀️</b><b class="moon">🌙</b></span>
    <div id="date"></div>
    <div class="btns">
      <button id="bTown" title="Open town (T)">🏰 Town <kbd>T</kbd></button>
      <button id="bEnd" class="primary" title="End turn (E)">⏭ End Turn <kbd>E</kbd></button>
      <button id="bSnd" title="Sound on/off">🔊</button>
      <button id="bFs" title="Full screen (F)">⛶</button>
      <button id="bSave" title="Save game">💾</button>
      <button id="bHelp" title="Help">❓</button>
      <button id="bKd" title="Kingdom overview (K)">📋 Kingdom</button>
      <button id="bSet" title="Settings">⚙</button>
      <button id="bMenu" title="Menu (Esc)">☰ Menu</button>
    </div>
  </header>
  <div id="game">
    <div id="stage">
      <canvas id="map" width="960" height="640"></canvas>
      <canvas id="bat" width="960" height="640"></canvas>
      <div id="zoomctl"><button id="zIn" title="Zoom in (+)">＋</button><button id="zOut" title="Zoom out (-)">－</button><button id="zHome" title="Center on hero (H)">🎯</button></div>
      <div id="tip" class="hide"></div>
      <div id="banner"></div>
      <div id="toast"></div>
      <div id="autosave" class="hide">💾 Autosaved</div>
    </div>
    <aside id="side">
      <div id="minipanel"><canvas id="mini" width="240" height="168"></canvas><i class="compass" aria-hidden="true"><b class="cn">N</b><b class="ce">E</b><b class="cs">S</b><b class="cw">W</b><em></em></i></div>
      <div id="hero"></div>
      <div id="army"></div>
      <div id="terr"></div>
      <div id="emblem" aria-hidden="true"><svg viewBox="0 0 220 74" focusable="false"><defs><linearGradient id="emG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0d27a"/><stop offset="1" stop-color="#8a6420"/></linearGradient><linearGradient id="emB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6aa0ff"/><stop offset="1" stop-color="#1e3f8a"/></linearGradient></defs><path d="M110 8 L124 36 L110 66 L96 36 Z" fill="url(#emB)" stroke="#0c0803" stroke-width="2"/><path d="M110 8 L124 36 L110 36 Z" fill="rgba(255,255,255,.22)"/><path d="M92 40C80 40 66 34 54 22c4 14 12 24 24 30-10 2-20-2-28-8 6 12 18 20 34 20" fill="none" stroke="url(#emG)" stroke-width="5" stroke-linecap="round"/><path d="M128 40c12 0 26-6 38-18-4 14-12 24-24 30 10 2 20-2 28-8-6 12-18 20-34 20" fill="none" stroke="url(#emG)" stroke-width="5" stroke-linecap="round"/><circle cx="110" cy="36" r="4.5" fill="url(#emG)" stroke="#0c0803" stroke-width="1.5"/></svg></div>
      <div id="batui">
        <h3 id="btitle">Battle</h3>
        <div class="row">
          <button id="bWait" title="Wait (W)">⏳ Wait <kbd>W</kbd></button>
          <button id="bDef" title="Defend (D)">🛡 Defend <kbd>D</kbd></button>
          <button id="bSpell" title="Spellbook (S)">📖 Spells <kbd>S</kbd></button>
        </div>
        <div class="row">
          <button id="bBal" class="hide" title="Ballista: shoot an enemy stack">🏹 Ballista</button>
          <button id="bTent" class="hide" title="First aid tent: heal one of your stacks">⛺ First aid</button>
          <button id="bHero" title="Hero Strike (H)">🗡 Hero Strike <kbd>H</kbd></button>
          <button id="bMine" class="hide" title="Lay a mine (M)">💣 Lay mine</button>
        </div>
        <div class="row">
          <button id="bAuto" title="Auto-battle (A)">⏩ Auto</button>
          <button id="bZoom" title="Zoom the battlefield in or out">🔍</button>
          <button id="bFlee">🏳 Retreat</button>
          <span id="bManaB" class="pill"></span>
        </div>
        <div id="spells" class="hide"></div>
        <div id="blog"></div>
      </div>
    </aside>
  </div>
  <nav id="mbar">
    <button id="mHero" title="Hero stats, skills and spells"><b class="ic"><svg viewBox="0 0 32 32"><use href="#i-hero"/></svg></b><span>Hero</span></button>
    <button id="mArmy" title="Your warriors"><b class="ic"><svg viewBox="0 0 32 32"><use href="#i-army"/></svg></b><span>Army</span></button>
    <button id="mGear" title="Hero equipment"><b class="ic"><svg viewBox="0 0 32 32"><use href="#i-gear"/></svg></b><span>Gear</span></button>
    <button id="mLand" title="Territory and minimap"><b class="ic"><svg viewBox="0 0 32 32"><use href="#i-land"/></svg></b><span>Land</span></button>
    <button id="mTown" title="Open your town"><b class="ic"><svg viewBox="0 0 32 32"><use href="#i-town"/></svg></b><span>Town</span></button>
    <button id="mEnd" class="primary"><b class="ic"><svg viewBox="0 0 32 32"><use href="#i-end"/></svg></b><span>End turn</span></button>
    <button id="mMenu" title="Menu"><b class="ic"><svg viewBox="0 0 32 32"><use href="#i-menu"/></svg></b><span>Menu</span></button>
  </nav>
  <div id="hint" class="hide"><div id="hintTxt"></div><div class="hb"><button id="hintOk" class="primary">Got it</button><button id="hintOff">Hide hints</button></div></div>
  <div id="rotate" class="hide"><div class="rotbox"><svg viewBox="0 0 64 64" class="rotico"><rect x="20" y="6" width="24" height="46" rx="4" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="32" cy="46" r="2" fill="currentColor"/><path d="M50 18c6 3 9 8 8 14M58 32l-4-4m4 4l4-4" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/></svg><b>Turn your phone sideways</b><span>Battles are fought on a wide field — rotate the screen to see all of it.</span><button id="rotateSkip">Play in portrait anyway</button></div></div>
  <div id="modal" class="hide"><div id="mres"></div><div id="mbox"></div></div>
  <div id="title">
    <div class="titlebox">
      <svg class="crest" viewBox="0 0 120 120" aria-hidden="true">
        <defs><linearGradient id="cgS" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe9a0"/><stop offset="1" stop-color="#d89a22"/></linearGradient>
        <linearGradient id="cgM" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f7ff"/><stop offset="1" stop-color="#8ea6d8"/></linearGradient>
        <clipPath id="cL"><rect x="0" y="0" width="60" height="120"/></clipPath><clipPath id="cR"><rect x="60" y="0" width="60" height="120"/></clipPath></defs>
        <circle cx="60" cy="60" r="56" fill="#140e07" stroke="#e6bf55" stroke-width="3"/><circle cx="60" cy="60" r="50" fill="none" stroke="#8c6a33" stroke-width="1"/>
        <g clip-path="url(#cL)"><g stroke="url(#cgS)" stroke-width="4" stroke-linecap="round"><path d="M60 10v12M60 98v12M10 60h12M25 25l9 9M25 95l9-9"/></g><circle cx="60" cy="60" r="22" fill="url(#cgS)"/></g>
        <g clip-path="url(#cR)"><circle cx="60" cy="60" r="30" fill="#1b2748"/><path d="M80 34a30 30 0 1 0 0 52a24 24 0 0 1 0-52z" fill="url(#cgM)"/><circle cx="88" cy="38" r="2" fill="#fff"/><circle cx="96" cy="70" r="1.6" fill="#fff"/><circle cx="84" cy="90" r="1.4" fill="#fff"/></g>
        <path d="M60 4v112" stroke="#e6bf55" stroke-width="1.5" opacity=".7"/>
      </svg>
      <h1>Day &amp; Night</h1>
      <div class="loadbar indet" id="loadbar" aria-hidden="true"><i id="loadfill"></i></div>
      <p class="loadtip" id="loadtip" aria-live="off"></p>
      <p class="small" id="loadmsg"></p>
      <p class="sub">Hex Kingdoms — rule by sword and spell</p>
      <div class="col">
        <button id="tNew" class="primary">New Game</button>
        <button id="tScn" class="main2">Scenarios</button>
        <button id="tCont" class="main2">Continue</button>
        <button id="tLoad" class="main2">Load game</button>
        <div class="sec2">
          <button id="tAch">🏆 Achievements</button>
          <button id="tBoard">📊 Leaderboard</button>
          <button id="tSet">⚙ Settings</button>
          <button id="tHelp">How to Play</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script defer src="js/settings.js"></script>
<script defer src="js/assets.js"></script>
<script defer src="js/sfx.js"></script>
<script defer src="js/fx.js"></script>
<script defer src="js/data.js"></script>
<script defer src="js/names.js"></script>
<script defer src="js/art.js"></script>
<script defer src="js/figures.js"></script>
<script defer src="js/townart.js"></script>
<script defer src="js/icons.js"></script>
<script defer src="js/gi.js"></script>
<script defer src="js/ach.js"></script>
<script defer src="js/board.js"></script>
<script defer src="js/map.js"></script>
<script defer src="js/battle.js"></script>
<script defer src="js/main.js"></script>
<script defer src="js/uifx.js"></script>
<script>
  // installable + offline on https hosts (e.g. Cloudflare Pages); skipped on localhost so development is never cached
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
<script>
  // the splash is up from the first paint; remove it once the game scripts have run and the page has loaded
  (function () {
    var Q = ["“May the Force be with you.” — Star Wars", "“I’ll be back.” — The Terminator", "“There’s no place like home.” — The Wizard of Oz", "“You shall not pass!” — The Lord of the Rings", "“Winter is coming.” — Game of Thrones", "“It’s dangerous to go alone! Take this.” — The Legend of Zelda", "“The cake is a lie.” — Portal", "“Do. Or do not. There is no try.” — Star Wars", "“Why so serious?” — The Dark Knight", "“Nothing is true, everything is permitted.” — Assassin’s Creed", "“Stay a while and listen.” — Diablo", "“Just keep swimming.” — Finding Nemo", "“Hello there!” — Star Wars"];
    var qe = document.getElementById('bootq'), qi = Math.floor(Math.random() * Q.length);
    function q() { if (!qe || !qe.parentNode) return; qe.style.opacity = '0'; setTimeout(function () { qe.textContent = Q[qi++ % Q.length]; qe.style.opacity = '1'; }, 400); setTimeout(q, 3200); }
    if (qe) { qe.textContent = Q[qi++ % Q.length]; setTimeout(q, 3200); }
    var t0 = Date.now(), gone = false;
    function hide() { if (gone) return; gone = true; var b = document.getElementById('boot'); if (!b) return; b.style.opacity = '0'; setTimeout(function () { if (b.parentNode) b.parentNode.removeChild(b); }, 550); }
    function go() { setTimeout(hide, Math.max(0, 2200 - (Date.now() - t0))); }
    if (document.readyState === 'complete') go(); else window.addEventListener('load', go);
    setTimeout(hide, 12000);
  })();
</script>
</body>
</html>
