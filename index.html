<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#150f09">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Day &amp; Night — Hex Kingdoms</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <i class="sky skyD"></i><i class="sky skyN"></i>
    <div id="res"></div>
    <div id="income" class="chip" title="Expected daily income"></div>
    <span id="orb" title="Day: your turn · Night: the rivals move"><b class="sun">☀️</b><b class="moon">🌙</b></span>
    <div id="date"></div>
    <div class="btns">
      <button id="bTown" title="Open town (T)">🏰 Town <kbd>T</kbd></button>
      <button id="bEnd" class="primary" title="End turn (E)">⏭ End Turn <kbd>E</kbd></button>
      <button id="bSnd" title="Sound on/off">🔊</button>
      <button id="bSave" title="Save game">💾</button>
      <button id="bHelp" title="Help">❓</button>
      <button id="bKd" title="Kingdom overview (K)">📋 Kingdom</button>
      <button id="bSet" title="Settings">⚙</button>
      <button id="bMenu" title="Menu (Esc)">☰ Menu</button>
    </div>
  </header>
  <div id="game">
    <div id="stage">
      <canvas id="map" width="960" height="640"></canvas>
      <canvas id="bat" width="960" height="640"></canvas>
      <div id="zoomctl"><button id="zIn" title="Zoom in (+)">＋</button><button id="zOut" title="Zoom out (-)">－</button><button id="zHome" title="Center on hero (H)">🎯</button></div>
      <div id="tip" class="hide"></div>
      <div id="banner"></div>
      <div id="toast"></div>
      <div id="autosave" class="hide">💾 Autosaved</div>
    </div>
    <aside id="side">
      <canvas id="mini" width="240" height="168"></canvas>
      <div id="hero"></div>
      <div id="terr"></div>
      <div id="army"></div>
      <div id="batui">
        <h3 id="btitle">Battle</h3>
        <div class="row">
          <button id="bWait" title="Wait (W)">⏳ Wait <kbd>W</kbd></button>
          <button id="bDef" title="Defend (D)">🛡 Defend <kbd>D</kbd></button>
          <button id="bSpell" title="Spellbook (S)">📖 Spells <kbd>S</kbd></button>
        </div>
        <div class="row">
          <button id="bHero" title="Hero Strike (H)">🗡 Hero Strike <kbd>H</kbd></button>
          <button id="bMine" class="hide" title="Lay a mine (M)">💣 Lay mine</button>
        </div>
        <div class="row">
          <button id="bAuto" title="Auto-battle (A)">⏩ Auto</button>
          <button id="bFlee">🏳 Retreat</button>
          <span id="bManaB" class="pill"></span>
        </div>
        <div id="spells" class="hide"></div>
        <div id="blog"></div>
      </div>
    </aside>
  </div>
  <nav id="mbar">
    <button id="mHero" title="Hero stats, skills and spells"><b>🏇</b><span>Hero</span></button>
    <button id="mArmy" title="Your warriors"><b>⚔️</b><span>Army</span></button>
    <button id="mGear" title="Hero equipment"><b>🎒</b><span>Gear</span></button>
    <button id="mLand" title="Territory and minimap"><b>🗺️</b><span>Land</span></button>
    <button id="mTown" title="Open your town"><b>🏰</b><span>Town</span></button>
    <button id="mEnd" class="primary"><b>⏭</b><span>End turn</span></button>
    <button id="mMenu" title="Menu"><b>☰</b><span>Menu</span></button>
  </nav>
  <div id="hint" class="hide"><div id="hintTxt"></div><div class="hb"><button id="hintOk" class="primary">Got it</button><button id="hintOff">Hide hints</button></div></div>
  <div id="modal" class="hide"><div id="mres"></div><div id="mbox"></div></div>
  <div id="title">
    <div class="titlebox">
      <svg class="crest" viewBox="0 0 120 120" aria-hidden="true">
        <defs><linearGradient id="cgS" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe9a0"/><stop offset="1" stop-color="#d89a22"/></linearGradient>
        <linearGradient id="cgM" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f7ff"/><stop offset="1" stop-color="#8ea6d8"/></linearGradient>
        <clipPath id="cL"><rect x="0" y="0" width="60" height="120"/></clipPath><clipPath id="cR"><rect x="60" y="0" width="60" height="120"/></clipPath></defs>
        <circle cx="60" cy="60" r="56" fill="#140e07" stroke="#e6bf55" stroke-width="3"/><circle cx="60" cy="60" r="50" fill="none" stroke="#8c6a33" stroke-width="1"/>
        <g clip-path="url(#cL)"><g stroke="url(#cgS)" stroke-width="4" stroke-linecap="round"><path d="M60 10v12M60 98v12M10 60h12M25 25l9 9M25 95l9-9"/></g><circle cx="60" cy="60" r="22" fill="url(#cgS)"/></g>
        <g clip-path="url(#cR)"><circle cx="60" cy="60" r="30" fill="#1b2748"/><path d="M80 34a30 30 0 1 0 0 52a24 24 0 0 1 0-52z" fill="url(#cgM)"/><circle cx="88" cy="38" r="2" fill="#fff"/><circle cx="96" cy="70" r="1.6" fill="#fff"/><circle cx="84" cy="90" r="1.4" fill="#fff"/></g>
        <path d="M60 4v112" stroke="#e6bf55" stroke-width="1.5" opacity=".7"/>
      </svg>
      <h1>Day &amp; Night</h1>
      <p class="small" id="loadmsg"></p>
      <p class="sub">Hex Kingdoms — rule by sword and spell</p>
      <div class="col">
        <button id="tNew" class="primary">New Game</button>
        <button id="tScn" class="main2">Scenarios</button>
        <button id="tCont" class="main2">Continue</button>
        <button id="tLoad" class="main2">Load game</button>
        <div class="sec2">
          <button id="tAch">🏆 Achievements</button>
          <button id="tBoard">📊 Leaderboard</button>
          <button id="tSet">⚙ Settings</button>
          <button id="tHelp">How to Play</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="js/settings.js"></script>
<script src="js/assets.js"></script>
<script src="js/sfx.js"></script>
<script src="js/fx.js"></script>
<script src="js/data.js"></script>
<script src="js/names.js"></script>
<script src="js/art.js"></script>
<script src="js/figures.js"></script>
<script src="js/townart.js"></script>
<script src="js/icons.js"></script>
<script src="js/ach.js"></script>
<script src="js/board.js"></script>
<script src="js/map.js"></script>
<script src="js/battle.js"></script>
<script src="js/main.js"></script>
<script>
  // installable + offline on https hosts (e.g. Cloudflare Pages); skipped on localhost so development is never cached
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
